<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Demande aux moteurs de recherche (Google...) de ne pas référencer le jeu -->
  <meta name="robots" content="noindex, nofollow">
  <title>Stickman</title>
  <!-- ?v=... : numéro de version, augmenté à chaque mise en ligne pour que les
       navigateurs rechargent les fichiers au lieu d'utiliser une ancienne copie -->
  <link rel="stylesheet" href="style.css?v=2026112204">
</head>
<body>
  <!-- Lobby -->
  <main id="lobby">
    <h1 id="titre">Stickman</h1>
    <form id="form-rejoindre" autocomplete="off">
      <label for="nom">Ton nom</label>
      <input id="nom" maxlength="16" placeholder="ex. Bob" required>
      <div id="choix-tete" hidden>
        <span class="label">Ta tête</span>
        <div id="grille-tetes" role="radiogroup" aria-label="Choix de la tête"></div>
      </div>
      <button type="submit">Rejoindre la partie</button>
    </form>
    <p id="mode" class="petit"></p>
  </main>

  <!-- Jeu -->
  <section id="jeu" hidden>
    <canvas id="canvas"></canvas>
    <div id="hud">
      <div id="hud-ligne">
        <span id="hud-titre"></span>
        <span id="hud-joueurs"></span>
        <span class="petit">← → bouger · ↑ sauter · ↓ s'accroupir · Espace tirer</span>
      </div>
      <div id="scores"></div>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.50.0/dist/umd/supabase.min.js"></script>
  <script src="config.js?v=2026112204"></script>
  <script src="net.js?v=2026112204"></script>
  <script src="game.js?v=2026112204"></script>
</body>
</html>
